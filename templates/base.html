<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <title>Amaranth</title>
    <link rel="stylesheet" href="/static/style.css?v=1">
  </head>
  <body>
    <header>
      <p><a href="/">Amaranth</a></p>
      {% if session.username %}
        <p class="right"><a href="/logout">Logout</a> | <a href="/user/{{session.username}}">Profile</a></p>
      {% else %}
        <p class="right"><a href="/register">Register</a> | <a href="/login">Login</a></p>
      {% endif %}
    </header>
    <main>
      {# This is a templating comment #}
      {% block body %}
      <p>Base! You shouldn't be seeing this. Extend it to other templates instead.</p>
      {% endblock %}
    </main>
    <footer>
      <p>Footer</p>
      <p class="right"><a rel="external" href="https://github.com/Miabread/amaranth">Source</a></p>
    </footer>
  </body>
</html>
